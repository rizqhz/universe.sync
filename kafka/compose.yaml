services:
  kafka:
    container_name: universe.broker.kafka
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://127.0.0.1:9091,EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://kafka.universe.sync:9092,INTERNAL://universe.broker.kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    hostname: node-kafka
    networks:
      - universe.domain
    volumes:
      - /docker/kafka/data:/var/lib/kafka/data:rw
    healthcheck:
      test: >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server universe.broker.kafka:9093 --list || exit 1
      start_period: 30s
      start_interval: 10s
      retries: 3
      interval: 5m
      timeout: 10s
    restart: unless-stopped
