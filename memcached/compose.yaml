services:
  memcached:
    container_name: universe.cache.memcached
    image: memcached:1.6.45-alpine3.24
    hostname: node-memcached
    networks:
      - universe.domain
    healthcheck:
      test: >
        echo stats | nc 127.0.0.1 11211 | grep uptime || exit 1
      start_period: 30s
      start_interval: 10s
      retries: 3
      interval: 5m
      timeout: 10s
    command: memcached -v -c 1024 -t 4 -m 64
    restart: unless-stopped
