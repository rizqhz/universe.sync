services:
  mongo.server:
    container_name: universe.db.mongo.server
    image: mongo:9.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    hostname: node-mongo-server
    networks:
      - universe.domain
    # ports:
    #   - "27017:27017" (nginx)
    volumes:
      - /docker/mongo/data:/data/db:rw
    # depends_on:
    #   - (none)
    healthcheck:
      test: >
        mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD \
          --authenticationDatabase admin \
          --eval "db.adminCommand('ping')" || exit 1
      start_period: 1m
      start_interval: 1s
      retries: 3
      interval: 1m30s
      timeout: 10s
    restart: unless-stopped
