services:
  nginx:
    container_name: universe.proxy.server
    image: nginx:1.31.7-alpine3.24
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: ${NGINX_ENTRYPOINT_QUIET_LOGS:-1}
    hostname: node-nginx
    networks:
      - universe.domain
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:3306:3306"
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:27017:27017"
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:11211:11211"
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:9092:9092"
    volumes:
      - /docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - mysql.store:/var/www/html:ro
    depends_on:
      mysql.panel:
        condition: service_healthy
        restart: true
      pgsql.panel:
        condition: service_healthy
        restart: true
      mongo.server:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      memcached:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      kafka:
        condition: service_healthy
        restart: true
    healthcheck:
      test: "curl -f -H 'Host: universe.sync' http://127.0.0.1/ping | grep -q PONG || exit 1"
      start_period: 1m
      start_interval: 1s
      retries: 3
      interval: 1m30s
      timeout: 10s
    restart: unless-stopped
