server {
    server_name universe.sync;
    listen      80;

    location /ping {
        return 200 PONG;
    }
}

server {
    server_name pgsql.universe.sync;
    listen      80;

    client_max_body_size 512M;

    location / {
        proxy_pass       http://universe.db.pgsql.panel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    server_name mysql.universe.sync;
    listen      80;
    root        /var/www/html;

    client_max_body_size 512M;

    location / {
        index index.php;
    }

    location ~ \.php$ {
        fastcgi_pass  universe.db.mysql.panel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include       fastcgi_params;
    }
}

server {
    server_name _;
    listen      80 default_server;
    return      404;
}
