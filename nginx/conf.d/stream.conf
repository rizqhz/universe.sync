upstream mysql {
    server universe.db.mysql.server:3306;
}

upstream pgsql {
    server universe.db.pgsql.server:5432;
}

upstream mongo {
    server universe.db.mongo.server:27017;
}

upstream redis {
    server universe.cache.redis:6379;
}

upstream memcached {
    server universe.cache.memcached:11211;
}

upstream rabbitmq {
    server universe.broker.rabbitmq:5672;
}

upstream kafka {
    server universe.broker.kafka:9092;
}

server {
    listen 3306;
    server_name mysql.universe.sync;
    proxy_pass mysql;
}

server {
    listen 5432;
    server_name pgsql.universe.sync;
    proxy_pass pgsql;
}

server {
    listen 27017;
    server_name mongo.universe.sync;
    proxy_pass mongo;
}

server {
    listen 6379;
    server_name redis.universe.sync;
    proxy_pass redis;
}

server {
    listen 11211;
    server_name memcached.universe.sync;
    proxy_pass memcached;
}

server {
    listen 5672;
    server_name rabbitmq.universe.sync;
    proxy_pass rabbitmq;
}

server {
    listen 9092;
    server_name kafka.universe.sync;
    proxy_pass kafka;
}
